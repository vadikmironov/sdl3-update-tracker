name: Renovate

# Finds a new upstream release and changes one line in upstream.json. It does
# no other work: renovate.json permits only that one manager.

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "full: find updates, but make no branch, pull request or issue"
        type: choice
        options: ["none", "full"]
        default: "none"
      log_level:
        type: choice
        options: ["info", "debug"]
        default: "info"

# The job uses only the token of the App.
permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The key of the App is a secret of this environment, and only main can use it.
    environment: renovate
    steps:
      # The token lives one hour, is for this repository only, and has only the
      # permissions below. The App has no Workflows permission at all.
      - name: Make a token of the App
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-checks: read
          permission-statuses: read

      - name: Run Renovate
        uses: renovatebot/github-action@dcfba84a42d1b5d5e49bf131b1bf53511851a123 # v46.3.1
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          # Commits through the API, so GitHub signs them as the App.
          RENOVATE_PLATFORM_COMMIT: "enabled"
          RENOVATE_DRY_RUN: ${{ inputs.dry_run == 'full' && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
