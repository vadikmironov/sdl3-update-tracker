name: Rerun once

# A runner can be bad: a download gets a 500, or the Bazel server stops on one
# machine. A second attempt on a different runner corrects that. This workflow
# starts the failed jobs of a CI run again, one time only. A true failure fails
# two times and stays red.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  rerun:
    name: Start the failed jobs again
    # run_attempt == 1 is the guard against a loop.
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --repo "$GITHUB_REPOSITORY" --failed
