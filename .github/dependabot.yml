# Renovate has no permission to change workflow files, on purpose. Dependabot
# updates the actions, and it needs no secret.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # The same wait as Renovate's minimumReleaseAge.
    cooldown:
      default-days: 3
    # One pull request for all the action updates of a week.
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: CI
